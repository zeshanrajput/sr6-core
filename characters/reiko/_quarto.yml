project:
  type: book
  output-dir: _book
  resources:
    - chapters/audio/
    - output/vtt/
    - output/text/
  pre-render:
    - uv run --directory ../.. sr6 sync-all

book:
  title: "REIKO // Yuriko Star Portfolio"
  author: "Reiko"
  date: "2026-06-17"
  chapters:
    - index.qmd
    - part: "Core Character"
      chapters:
        - chapters/identity_core.qmd
        - core/character_build.qmd
        - chapters/character_sheet.qmd
        - core/character_log.qmd
        - core/character_purchases.qmd
        - chapters/twenty_questions.qmd
        - rules/dronomancy.md
        - chapters/appendix_dossier.qmd
    - part: "Rules & Downtime Protocols"
      chapters:
        - rules/rules_and_downtime.qmd
        - rules/rules_matrix.qmd
        - rules/rules_sprites.qmd
        - rules/rules_drones.qmd
        - rules/rules_combat.qmd
    - part: "Background Stories"
      chapters:
        - narrative/01 The Weight of Zero.md
        - narrative/02 Color Blind Mathematics.md
        - narrative/03 The Soul Broker's Stall.md
        - narrative/04 The War Crime.md
        - narrative/05 A SINner's Loan.md
        - narrative/06 The Ghost in the Ledger.md
        - narrative/07 Sunday at r3sP@wn.md
    - part: "Out-of-Session Narratives"
      chapters:
        - chapters/08 Abandoning Tourism.md
        - chapters/09 Triangulation.md
        - chapters/10 Game Theory.md
        - chapters/11 Integrating over Infinity.md
        - chapters/12 Defrag.md
        - chapters/13 Field Trip.md
        - chapters/14 A Point of Favor.md
        - chapters/15 Core.md
        - chapters/16 Faith.md
        - chapters/17 Sheets.md
        - chapters/18 The Geometry of a Sieve.md
        - chapters/19 Legacy Code.md
        - chapters/20 The Price of Silk.md
        - chapters/21 ~.md
        - chapters/22 C Sharp.md
        - chapters/23 Tea with a Ghost.md
        - chapters/24 Symlink.md
    - part: "Reference & Specifications"
      chapters:
        - reference/visual_anchors.md
        - reference/river_people.md
        - reference/coffin_girls.md
        - reference/voice_spec.md

format:
  html:
    theme:
      - cosmo
      - theme.scss
    toc: true
    number-sections: false
    code-copy: true

execute:
  engine: jupyter
