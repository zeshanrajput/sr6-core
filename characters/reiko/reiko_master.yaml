sprite_powers:
- name: Death Mark
  source: Taz
  type: Sprite Power (Symbiosis)
  target: Persona using VR Mode (Hot-Sim / Cold-Sim)
  action: Minor Action (Sustained)
  effect: Cracking + RES vs INT + FW. Link-locks target and causes matching biofeedback
    damage whenever taking Matrix damage.
  origin: native
  doc_link: chapters/rules_sprites.html#sprite-symbiosis-powers
- name: Phantom
  source: Taz
  type: Sprite Power (Symbiosis)
  target: Persona / Device
  action: Minor Action (Sustained)
  effect: Conceals icon from Matrix searches. Threshold to find via specific Matrix
    Perception equals sprite Electronics + RES net hits.
  origin: native
  doc_link: chapters/rules_sprites.html#sprite-symbiosis-powers
- name: Override
  source: Taz
  type: Sprite Power (Symbiosis)
  target: Device on Autopilot (Drone / Vehicle)
  action: Minor Action
  effect: Electronics + Level/RES vs Device Rating + FW. Substitutes Level/RES for
    device Pilot rating. Enables Resonance Focus and Sprite Symbiosis on rigging.
  origin: added
  doc_link: chapters/rules_sprites.html#sprite-symbiosis-powers
- name: Harmonize
  source: Taz
  type: Sprite Power (Symbiosis)
  target: 100m Radius Area / Matrix
  action: Performance Action
  effect: Con (Performance) + RES reduces ambient Noise by hits, grants +hits bonus
    dice to healing/repairs, and matrix fauna regenerate 1 box/round.
  origin: added
  doc_link: chapters/rules_sprites.html#sprite-symbiosis-powers
