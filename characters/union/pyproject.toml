[project]
name = "sr6sheet"
version = "0.1.0"
description = "Shadowrun 6e Character Portfolio & Story Anthology — Venn"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv",
    "google-genai",
    "jupyter>=1.1.1",
    "ipykernel>=7.3.0",
    "pyyaml>=6.0.3",
    "sherpa-onnx",
    "lameenc",
    "numpy",
    "onnxruntime",
    "sr6-core",
]

[tool.uv.sources]
sr6-core = { path = "../sr6-core", editable = true }

