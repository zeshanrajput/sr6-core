project:
  type: book
  output-dir: _book
  resources:
    - chapters/audio/
    - output/vtt/
    - output/text/
  pre-render:
    - uv run --directory ../.. sr6 sync-all

book:
  title: "VELVET // Jin-Young Character Dossier"
  author: "Velvet"
  date: "2026-06-17"
  chapters:
    - index.qmd
    - part: "Core Character"
      chapters:
        - chapters/identity_core.md
        - core/character_build.qmd
        - chapters/character_sheet.qmd
        - core/character_log.qmd
        - core/character_purchases.qmd
        - chapters/twenty_questions.qmd
        - rules/rules_and_downtime.qmd
        - chapters/appendix_dossier.qmd
    - part: "Narrative Log"
      chapters:
        - narrative/01_transaction.md
        - narrative/02_faceless_mirror.md
        - narrative/03_dark_wings.md
        - narrative/04_sabotage.md
        - narrative/05_first_negotiation.md
        - narrative/06_seattle_web.md
        - narrative/07_bliss.md
        - narrative/08_Tea_in_Tacoma.md
        - narrative/09_Heat.md
        - narrative/10_Burns.md

    - part: "Reference & Specifications"
      chapters:
        - reference/philosophical_framework.md
        - reference/karmic_persona_log.md
        - reference/voice_spec.md
        - reference/story_arc1.md
        - reference/story_arc2.md
        - reference/story_arc3.md
        - reference/story_continuity.md

format:
  html:
    theme:
      - cosmo
      - theme.scss
    toc: true
    number-sections: false
    code-copy: true

execute:
  engine: jupyter
