project:
  type: book
  output-dir: _book
  resources:
    - narrative/audio/
    - output/text/
  pre-render:
    - uv run --directory ../.. sr6 sync-all

book:
  title: "VENN // Nathan Turrent & Veronica Character Dossier"
  author: "Venn"
  date: "2026-07-26"
  chapters:
    - index.qmd
    - part: "Core Character"
      chapters:
        - core/character_build.qmd
        - chapters/character_sheet.qmd
        - core/character_log.qmd
        - core/character_purchases.qmd
        - chapters/twenty_questions.qmd
        - chapters/narrative_outline.qmd
    - part: "Tabletop Mechanics & Audited Interplays"
      chapters:
        - rules/rules_and_downtime.qmd
    - part: "Narrative Anthology"
      chapters:
        - narrative/01_the_day_a_god_fell.md
        - narrative/02_salt_marsh_node.md
        - narrative/03_threading_the_wire.md
        - narrative/04_night_of_her_own.md
        - narrative/05_dual_icons_foundation.md
        - narrative/06_sabotaged_berth.md
        - narrative/07_first_contract.md

format:
  html:
    theme:
      - cosmo
      - theme.scss
    toc: true
    number-sections: false
    code-copy: true

execute:
  engine: jupyter
