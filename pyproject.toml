[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sr6-core"
version = "0.1.0"
description = "Core rules engine, character creation auditor, multi-format exporter, RAG assistant, and interactive CLI manager for Shadowrun 6th Edition"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "google-genai>=0.1.0",
    "requests>=2.28.0",
    "numpy>=1.24.0",
    "rich>=13.0.0",
    "mutagen>=1.47.0",
    "reportlab>=4.0.0",
    "prompt-toolkit>=3.0.0",
    "colorama>=0.4.6"
]

[project.scripts]
sr6 = "sr6core.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["sr6core"]
