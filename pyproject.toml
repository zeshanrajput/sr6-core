[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sr6-core"
version = "0.1.0"
description = "Core rules engine, character creation auditor, multi-format exporter, RAG assistant, and interactive CLI manager for Shadowrun 6th Edition"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "google-genai>=0.1.0",
    "requests>=2.28.0",
    "numpy>=1.24.0",
    "rich>=13.0.0",
    "mutagen>=1.47.0",
    "prompt-toolkit>=3.0.0",
    "colorama>=0.4.6",
    "jupyter>=1.1.1",
    "ipykernel>=7.3.0",
    "sqlite-vec>=0.1.9",
    "pytest>=8.0.0",
    "faster-whisper>=1.0.0",
    "av<14",
    "yt-dlp>=2024.0.0"
]

[project.optional-dependencies]
narration = [
    "lameenc>=1.7.0",
    "torch",
    "torchaudio",
    "kokoro>=0.8.4",
    "soundfile>=0.12.1",
    "spacy>=3.7.0",
    "en-core-web-sm",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[project.scripts]
sr6 = "sr6core.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["sr6core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
