# -----------------------------------------------------------------------------
# 6. Regex Pattern Replacements
# -----------------------------------------------------------------------------
patterns:
  - match: '¥\s*(\d[\d,.]*)'
    replace: '\1 new yen'
  - match: '¥'
    replace: ' new yen '
  - match: '(\b[A-Za-z]+)-chan\b'
    replace: '\1 chahn'
  - match: '(\b[A-Za-z]+)-san\b'
    replace: '\1 sahn'
  - match: '\bR[-_\s]*31[-_\s]*K[-_\s]*0(\''s)?\b'
    replace: 'R 31 K 0\1'
  - match: '\br31-?k0(\''s)?\b'
    replace: 'R 31 K 0\1'
  - match: '\bT@z(\''s)?\b'
    replace: 'Taz\1'
  - match: '\bt@z(\''s)?\b'
    replace: 'taz\1'
  - match: '\br3sP@wn(\''s)?\b'
    replace: 'respawn\1'
  - match: '\bsoy-burgers?\b'
    replace: 'soyburger'
  - match: '\bblack-market\b'
    replace: 'black market'
  - match: '\bquick-mart\b'
    replace: 'quick mart'
  - match: '\b([a-zA-Z]+)mechs\b'
    replace: '\1meks'
  - match: '\b([a-zA-Z]+)mech\b'
    replace: '\1mek'
  - match: '\bcatch lead\b'
    replace: 'catch led'
  - match: '\breach the lead\b'
    replace: 'reach the led'
  - match: '\bcaught the lead\b'
    replace: 'caught the led'
  - match: '\binstead of lead\b'
    replace: 'instead of led'
  - match: '\bmended tear\b'
    replace: 'mended tare'
