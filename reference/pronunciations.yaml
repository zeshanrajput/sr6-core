# -----------------------------------------------------------------------------
# 6. Regex Pattern Replacements
# -----------------------------------------------------------------------------
patterns:
  - match: '¥\s*(\d[\d,.]*)'
    replace: '\1 new yen'
  - match: '¥'
    replace: ' new yen '
  - match: '(\b[A-Za-z]+)-chan\b'
    replace: '\1 chahn'
  - match: '(\b[A-Za-z]+)-san\b'
    replace: '\1 sahn'
  - match: '\bR[-_\s]*31[-_\s]*K[-_\s]*0(\''s)?\b'
    replace: 'R 31 K 0\1'
  - match: '\br31-?k0(\''s)?\b'
    replace: 'R 31 K 0\1'
  - match: '\bT@z(\''s)?\b'
    replace: 'Taz\1'
  - match: '\bt@z(\''s)?\b'
    replace: 'taz\1'
  - match: '\br3sP@wn(\''s)?\b'
    replace: 'respawn\1'
  - match: '\bsoy-burgers?\b'
    replace: 'soyburger'
  - match: '\bblack-market\b'
    replace: 'black market'
  - match: '\bquick-mart\b'
    replace: 'quick mart'
  - match: '\b([a-zA-Z]+)mechs\b'
    replace: '\1meks'
  - match: '\b([a-zA-Z]+)mech\b'
    replace: '\1mek'
  - phase: pre
    match: '\b((?:paused|resumed|continued|stopped|began|finished)\s+(?:her|his|my|their|the)\s+)bowing\b'
    replace: '\1[bowing](/bˈOɪŋ/)'
  - phase: pre
    match: '\b((?:violin|cello|fiddle|stradivarius|rosin|horsehair|archery)\s+)bow\b'
    replace: '\1[bow](/bˈO/)'
  - phase: pre
    match: '\b((?:violin|cello|fiddle|stradivarius|rosin|horsehair|archery)\s+)bows\b'
    replace: '\1[bows](/bˈOz/)'
  - phase: pre
    match: '\b((?:violin|cello|fiddle|stradivarius|rosin|horsehair|archery)\s+)bowed\b'
    replace: '\1[bowed](/bˈOd/)'
  - phase: pre
    match: '\b((?:violin|cello|fiddle|stradivarius|rosin|horsehair|archery)\s+)bowing\b'
    replace: '\1[bowing](/bˈOɪŋ/)'
  - phase: pre
    match: '\bbow(\s+(?:of\s+the\s+(?:violin|cello|fiddle)|hair|hand|arm|stroke|strokes|across\s+(?:the\s+)?strings?|over\s+(?:the\s+)?strings?))\b'
    replace: '[bow](/bˈO/)\1'
  - phase: pre
    match: '\bbowed(\s+(?:the\s+)?(?:strings?|violin|cello|fiddle|notes?|melody))\b'
    replace: '[bowed](/bˈOd/)\1'
  - phase: pre
    match: '\bbowing(\s+(?:the\s+)?(?:strings?|violin|cello|fiddle|notes?|melody|across))\b'
    replace: '[bowing](/bˈOɪŋ/)\1'
  - phase: pre
    match: '\b(draw(?:s|ing)?|drew|rosin(?:ed|ing)?|resin(?:ed|ing)?|tighten(?:ed|ing)?|tuck(?:ed|ing)?|stowed|lifted|raised)\s+(her|his|my|their|the|a)\s+bow\b'
    replace: '\1 \2 [bow](/bˈO/)'
  - phase: pre
    match: '\b(like|heavy as|made of|cast in|solid|molten|gray|grey|hail of|rain of|curtain of|sheet of|sheets of|pumped|eating|while the|as the)\s+lead\b'
    replace: '\1 led'
  - phase: pre
    match: '\blead(?=[-\s]+(?:lined|pipe|pipes|pipework|shield|shielding|vest|apron|ballast|weight|weights|slug|slugs|bullet|bullets|core|cores|brick|bricks|shot|alloy|solder|seal|seals|jacketed|flew|flies|flying|rained|poured))\b'
    replace: 'led'
  - phase: pre
    match: '\b(stream|river|creek|brook|path|road|trail|alley|corridor|staircase|stairs|vine|vines|root|roots|wire|wires|cable|cables|thread|threads|rope|ribbon|serpent|snake)\s+wound\b'
    replace: '\1 [wound](/wˈWnd/)'
  - phase: pre
    match: '\bwound\s+(its way|their way|into a coil|tightly|tight)\b'
    replace: '[wound](/wˈWnd/) \1'
  - match: '\bcatch lead\b'
    replace: 'catch led'
  - match: '\breach the lead\b'
    replace: 'reach the led'
  - match: '\bcaught the lead\b'
    replace: 'caught the led'
  - match: '\binstead of lead\b'
    replace: 'instead of led'
  - match: '\bmended tear\b'
    replace: 'mended tare'
  - match: '\bscreen read closed\b'
    replace: 'screen red closed'
  - match: '\bBus is live\b'
    replace: 'Bus is lyve'
